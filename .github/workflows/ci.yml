name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit version (e.g. 1.0.0). Empty = derive from conventional commits.'
        required: false

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      
      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Configure Nx Agents and task distribution in .nx/ci-config.yaml
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#nx-cloud-start-nx-agents
      - run: npx nx start-nx-agents

      
      # Cache node_modules
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
       
      - run: npm ci
      - uses: nrwl/nx-set-shas@v5


      # Prepend any command with "nx record --" to record its logs to Nx Cloud
      # - run: npx nx record -- echo Hello World
      - run: npx nx affected -t lint test build typecheck

      - name: Build package for release
        if: github.ref == 'refs/heads/main'
        run: npx nx run @jaxvik/nx-aspire:build

      - name: Upload package build
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: nx-aspire-dist
          path: projects/aspire/nx-aspire/dist
          retention-days: 1
      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - run: npx nx fix-ci
        if: always()

  release:
    needs: main
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: npm-publish
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Download package build
        uses: actions/download-artifact@v4
        with:
          name: nx-aspire-dist
          path: projects/aspire/nx-aspire/dist

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release
        run: |
          RELEASE_TAGS="$(git tag -l 'v*')"
          if [ -z "$VERSION" ] && [ -z "$RELEASE_TAGS" ]; then
            echo "No release tag exists yet. Dispatch manually with an explicit version (e.g. 1.0.0) for the first release."
            exit 0
          fi
          if [ -n "$VERSION" ]; then
            if [ -z "$RELEASE_TAGS" ]; then
              npx nx release --yes "$VERSION" --first-release
            else
              npx nx release --yes "$VERSION"
            fi
          else
            npx nx release --yes
          fi
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
