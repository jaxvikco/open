name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      
      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Configure Nx Agents and task distribution in .nx/ci-config.yaml
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#nx-cloud-start-nx-agents
      - run: npx nx start-nx-agents

      
      # Cache node_modules
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
       
      - run: npm ci
      - uses: nrwl/nx-set-shas@v5


      # Prepend any command with "nx record --" to record its logs to Nx Cloud
      # - run: npx nx record -- echo Hello World
      - run: npx nx affected -t lint test build typecheck

      - name: Build package for release
        if: github.ref == 'refs/heads/main'
        run: npx nx run @jaxvik/nx-aspire:build

      - name: Upload package build
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: nx-aspire-dist
          path: projects/aspire/nx-aspire/dist
          retention-days: 1
      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - run: npx nx fix-ci
        if: always()

  release:
    needs: main
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          filter: tree:0
          fetch-depth: 0

      - name: Check tested commit is still main
        id: release_guard
        run: |
          git fetch origin main
          main_sha="$(git rev-parse FETCH_HEAD)"
          if [ "$main_sha" = "$GITHUB_SHA" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "main advanced to $main_sha; skipping release for $GITHUB_SHA"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v6
        if: steps.release_guard.outputs.should_release == 'true'
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
        if: steps.release_guard.outputs.should_release == 'true'

      - name: Download package build
        if: steps.release_guard.outputs.should_release == 'true'
        uses: actions/download-artifact@v4
        with:
          name: nx-aspire-dist
          path: projects/aspire/nx-aspire/dist

      - name: Configure git identity
        if: steps.release_guard.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release
        if: steps.release_guard.outputs.should_release == 'true'
        run: |
          release_tags="$(git tag --list '@jaxvik/nx-aspire@*')"
          if [ -z "$release_tags" ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              npx nx release 1.0.0 --first-release --yes
            else
              echo "No release tag exists yet; run this workflow manually from main to publish the first release as 1.0.0."
            fi
          else
            npx nx release --yes
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
