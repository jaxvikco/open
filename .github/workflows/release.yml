name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit version (e.g. 1.0.0). Empty = derive from conventional commits.'
        required: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release
        run: |
          if [ -z "$VERSION" ] && [ -z "$(git tag -l 'v*')" ]; then
            echo "No release tag exists yet. Dispatch manually with an explicit version (e.g. 1.0.0) for the first release."
            exit 0
          fi
          if [ -n "$VERSION" ]; then
            npx nx release --yes "$VERSION"
          else
            npx nx release --yes
          fi
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
